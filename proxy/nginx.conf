events {
    worker_connections 1024;
}

stream {
    # SNI と転送量をセッションごとに記録する（中継が動いているかの確認用）
    log_format proxy_log '$time_iso8601 client=$remote_addr sni="$ssl_preread_server_name" '
                         'bytes_sent=$bytes_sent bytes_received=$bytes_received '
                         'session_time=$session_time upstream="$upstream_addr" status=$status';
    access_log /var/log/nginx/proxy_access.log proxy_log;
    error_log  /var/log/nginx/proxy_error.log info;

    # 中継先は公開 DNS で引く（ローカルの dnsmasq はこのサーバー自身を返すため）
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

    # 中継先は、実際の接続先を DNS ログと名前解決で調べて決めた
    upstream c560ws_cloud {
        server iot-dev-cg-primary-v1-green-2-e10c91e01d981861.elb.ap-southeast-1.amazonaws.com:443;
    }
    upstream tc92_cloud {
        server aps1-wap-clb-nbu-k8s-firewall.i.tplinknbu.com:443;
    }
    upstream use1_cloud {
        server use1-cvm-api.i.tplinknbu.com:443;
    }

    # Client Hello の SNI を見て中継先を選ぶ。TLS は終端しない。
    map $ssl_preread_server_name $upstream_choice {
        "security.iot.i.tplinknbu.com"                 tc92_cloud;
        "aps1-security.iot.i.tplinknbu.com"            tc92_cloud;
        "use1-cvm-api.i.tplinknbu.com"                 use1_cloud;
        "aps1-device-cloudgateway.iot.i.tplinknbu.com" c560ws_cloud;
        "aps1-device-tapo-care.i.tplinknbu.com"        c560ws_cloud;
        default                                        c560ws_cloud;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $upstream_choice;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;
    }
}
