# ------------------------------------------------------------
# DNS
# ------------------------------------------------------------
port=53
listen-address=192.168.1.10
bind-interfaces
server=192.168.1.1
server=1.1.1.1
no-resolv
no-poll
cache-size=1000

# 問い合わせをすべて記録する（接続先ドメインの調査と効果の確認に使う）
log-queries
log-facility=/var/log/dnsmasq/dnsmasq.log
log-async=50

conf-dir=/etc/dnsmasq.d/,*.conf

# ------------------------------------------------------------
# DHCP
# ------------------------------------------------------------
interface=enp1s0
dhcp-authoritative
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
dhcp-range=192.168.1.100,192.168.1.199,255.255.255.0,24h

# ふつうの端末: GW はルーター、DNS はこのサーバー（予備にルーター）
dhcp-option=3,192.168.1.1
dhcp-option=6,192.168.1.10,192.168.1.1

# カメラだけ: GW と DNS をこのサーバーにする
dhcp-option=tag:camera_sink,3,192.168.1.10
dhcp-option=tag:camera_sink,6,192.168.1.10

# カメラの固定割り当て（MAC アドレスは伏せている）
dhcp-host=xx:xx:xx:xx:xx:01,set:camera_sink,192.168.1.50,c560ws,infinite
dhcp-host=xx:xx:xx:xx:xx:02,set:camera_sink,192.168.1.51,tc92,infinite
